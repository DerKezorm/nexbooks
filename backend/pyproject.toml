[tool.ruff]
target-version = "py313"
line-length = 120
# The shared sign-in module and its contract tests are checked where they come from and copied
# unchanged; a problem there is fixed there, never here.
extend-exclude = ["app/vendor/nexoidc", "tests/nexoidc"]

[tool.ruff.lint]
extend-select = ["E501", "E402", "S608", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
# A tool that writes long lines of invented markup and one list of words.
"tools/make_reader_books.py" = ["E501", "SIM905"]
# A tool that reads a list of invented books and writes them into the database.
"tools/seed_discover.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
