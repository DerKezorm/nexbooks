<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexbooks">
  <!-- A shelf with three book spines, light on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx and scripts/app-icons.mjs. -->
  <style>
    .grund { fill: #fff } .rand { stroke: #8e3b46; stroke-opacity: .35 } .akzent { fill: #c0283f; stroke: #c0283f }
    .riefen { stroke: #fff } .v1 { stop-color: #d77f8b } .v2 { stop-color: #a3404e } .v3 { stop-color: #5e1f29 }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #170b0e } .rand { stroke: #d06a7a; stroke-opacity: .45 } .akzent { fill: #ff6b81; stroke: #ff6b81 }
      .riefen { stroke: #170b0e } .v1 { stop-color: #f6cdd3 } .v2 { stop-color: #d06a7a } .v3 { stop-color: #9b3a4a }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect x="14" y="20" width="9.5" height="29" rx="1.8" fill="none" stroke="url(#g)" stroke-width="3.8"/>
  <rect class="akzent" x="26.5" y="13.5" width="11" height="35.5" rx="1.8" stroke-width="3.8" stroke-linejoin="round"/>
  <path class="riefen" d="M29 20.5h6M29 41.5h6" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="41" y="19" width="9" height="30" rx="1.8" fill="none" stroke="url(#g)" stroke-width="3.8" transform="rotate(13 45.5 49)"/>
  <path d="M10.5 52.5h43" stroke="url(#g)" stroke-width="4.2" stroke-linecap="round"/>
</svg>
